# electron-builder.yml
# This file tells electron-builder how to package Wingman into a .dmg installer.
# Run:  npm run electron:dist  →  creates dist/ folder with Wingman.dmg

appId: ai.meetwingman.app
productName: Wingman
copyright: Copyright © 2025 Wingman AI

directories:
  output: dist            # The final .dmg goes here
  buildResources: build   # Icons and other build assets go here

# What files to bundle inside the app
files:
  - electron-dist/**/*    # Compiled Electron TypeScript (main.js, preload.js, etc.)
  - electron/hud/**/*     # The HUD overlay HTML file
  - public/**/*           # Icons and images
  - "!node_modules/.cache/**/*"  # Exclude only cache, electron-builder handles prod deps automatically

# Recall AI Desktop SDK ships native binaries that cannot run from inside app.asar.
# asarUnpack extracts these files next to the archive so they can execute normally.
asarUnpack:
  - "node_modules/@recallai/desktop-sdk/**/*"

# Extra files to bundle (these go in the app's Resources folder)
extraResources:
  - from: public/
    to: public/
    filter:
      - "**/*"

# macOS-specific settings
mac:
  category: public.app-category.business
  icon: build/icon.icns          # macOS requires .icns format (create from Wingman.png)
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true                 # Apple notarization — clean launch (no Gatekeeper warning) + required for auto-update. Uses APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from CI env.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Apple Silicon ONLY — the Recall AI SDK ships no Intel (x64) binary, so an x64 build
  # cannot run. Two targets, per the macOS auto-update contract:
  #   dmg = first manual download (drag-to-Applications installer)
  #   zip = REQUIRED by Squirrel.Mac — electron-updater can ONLY apply a .zip, never a .dmg
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

# What the DMG installer looks like
dmg:
  title: "Install Wingman"
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# Auto-update: publishes to GitHub Releases
# When you run electron:dist, it creates the files and uploads to GitHub
publish:
  provider: github
  owner: bandidoseb
  repo: wingman
  releaseType: release   # Publish LIVE, not draft. Drafts are invisible to electron-updater — this is why auto-update never worked. No more manual `gh release edit --draft=false`.

# Notarization is enabled above (mac.notarize: true) via electron-builder's built-in
# notarytool path — no custom afterSign script needed.
