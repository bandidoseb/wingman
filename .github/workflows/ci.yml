name: CI

# Runs the same gate Claude runs locally — typecheck (web + electron) + unit tests —
# on every PR into main. This is the server-side backstop: even if something slips past
# the local hooks, a PR can't merge with broken types or failing tests.

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (web)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron)
        run: npx tsc --noEmit -p tsconfig.electron.json

      - name: Unit tests
        run: npm test

      # Design Language §5b — colors must come from tokens in src/app/globals.css.
      # Ratchet, not a hard gate: existing debt is baselined, only INCREASES fail.
      # After migrating a screen, run `npm run token-lint -- --update` to tighten it.
      - name: Token lint (color literals)
        run: npm run token-lint
